packages:
  - "."
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowedVersions:
    vite: "*"
    vitest: "*"
  allowAny:
    - vite
    - vitest
allowBuilds:
  msgpackr-extract: false
ignoredBuiltDependencies:
  - msgpackr-extract
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.2.0
  vite-plus: 1.2.0
  vitest: 5.0.4
  "@vitest/coverage-v8": 5.0.4
